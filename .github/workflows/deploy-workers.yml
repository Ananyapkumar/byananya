# Puts the Cloudflare workers live whenever their code changes in this repo.
# Needs repo secrets: CLOUDFLARE_API_TOKEN, GROQ_KEY, GEMINI_KEY
name: Deploy workers
on:
  push:
    branches: [main]
    paths:
      - "say-it-better/backend/**"
      - "automation/blog-bot/**"
      - ".github/workflows/deploy-workers.yml"
  workflow_dispatch:

jobs:
  say-it-better:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: say-it-better/backend
          secrets: |
            GROQ_KEY
            GEMINI_KEY
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}

  blog-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/blog-bot
    steps:
      - uses: actions/checkout@v4
      - name: Deploy blog bot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          npx --yes wrangler@3 deploy 2>&1 | tee deploy.log || { echo "::error title=Deploy failed::$(tail -c 1200 deploy.log | tr '\n' ' ')"; exit 1; }
      - name: Save Groq and Tavily keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          TAVILY_KEY: ${{ secrets.TAVILY_KEY }}
        run: |
          set -o pipefail
          for name in GROQ_KEY TAVILY_KEY; do
            value="${!name}"
            if [ -z "$value" ]; then echo "::warning::$name is not set in GitHub secrets, skipping"; continue; fi
            printf '%s' "$value" | npx --yes wrangler@3 secret put "$name" 2>&1 | tee secret.log || { echo "::error title=Secret $name failed::$(tail -c 1200 secret.log | tr '\n' ' ')"; exit 1; }
          done
